# Everything under "your file server" and "how the library is organized" can also be left at their placeholder
# values here and set later from the app's own Settings > Library page instead (saved into the /data volume,
# so it survives redeploys and does not need docker compose up again) - whichever you find more convenient.
services:
  video-sorter:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: video-sorter:latest
    restart: unless-stopped
    ports:
      - "8770:8000"
    volumes:
      - video-sorter-data:/data
    environment:
      # --- required ---------------------------------------------------------
      # the password for the web UI (there is only one account)
      UI_PASSWORD: "change-me"

      # --- your file server ---------------------------------------------------
      # a Windows machine reachable over SMB *and* PowerShell remoting (WinRM, non-admin NTLM):
      # PowerShell remoting is what actually moves/deletes files (instant, same-volume renames);
      # SMB is only used to read/list/stream. See the README for how to set the account up.
      SMB_HOST: "10.0.0.5"
      SRC_SHARE: "downloads$"      # where new downloads land, unsorted
      DST_SHARE: "library$"        # the sorted library
      SRC_ROOT: 'H:\Downloads$'    # SRC_SHARE's local path on that same machine
      DST_ROOT: 'H:\Library$'      # DST_SHARE's local path
      # optional: log in with these on first start instead of typing them into Settings > Credentials
      # SMB_USER: "DOMAIN\\someuser"
      # SMB_PASS: ""

      # --- optional: how the library is organized -----------------------------
      # DUPES_DIR: "_dupes"            # inside SRC_SHARE: duplicates set aside for you to review/delete
      # REVIEW_DIR: "_To Sort"         # inside DST_SHARE: unidentified files (only if turned on) + "keep both" picks
      # MOVIES_DIR: "_Movie_Scenes"    # inside DST_SHARE: movie rips / scenes with no studio match
      # ORGANIZE_BY_STUDIO: "1"        # "0": everything lands directly in DST_SHARE, no per-studio subfolders

      # --- optional: StashDB ----------------------------------------------------
      # STASH_BASE: "https://stashdb.org"   # a self-hosted stash-box instance works too
      # STASH_USER: ""
      # STASH_PASS: ""

      # set to 1 if this sits behind an HTTPS reverse proxy, so the session cookie requires https
      COOKIE_SECURE: "0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s

volumes:
  video-sorter-data:
